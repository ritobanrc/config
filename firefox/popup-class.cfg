// AutoConfig (the first line is ignored). Installed to /usr/lib/firefox/.
//
// Give popup windows (window.open popups, extension dialogs like the Zotero
// Connector item selector) their own Wayland app-id, "firefox-popup". The
// title is only set after a window maps, so this is the one thing a
// compositor can match on in time to open the window floating.
Services.obs.addObserver(win => {
  win.addEventListener("DOMContentLoaded", function onLoad(e) {
    if (e.target !== win.document) {
      return;
    }
    win.removeEventListener("DOMContentLoaded", onLoad);
    const root = win.document.documentElement;
    if (root.getAttribute("windowtype") === "navigator:browser" && !win.toolbar.visible) {
      root.setAttribute("windowclass", "firefox-popup");
    }
  });
}, "domwindowopened");
